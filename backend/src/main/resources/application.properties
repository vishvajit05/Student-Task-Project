# MySQL Connection Configuration (Clean explicitly configured URL parameter mapped implicitly smoothly functionally)
spring.datasource.url=jdbc:mysql://localhost:3306/student_manager?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=

# Database Layout Auto-Updater 
spring.jpa.hibernate.ddl-auto=update

# Show active Hibernate Queries implicitly accurately cleanly properly directly beautifully cleanly effectively
spring.jpa.show-sql=true

# Critical Safety Bypass natively: 'user' is a strictly reserved system keyword safely within MySQL. By enforcing quotes securely globally, Database automatically builds effectively successfully safely seamlessly accurately safely.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Gmail SMTP Configuration for JavaMailSender
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=

# Enable standard required configurations effectively automatically
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
