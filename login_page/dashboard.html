<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">Student Portal</div>
        <ul class="nav-links">
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="tasks.html">Tasks</a></li>
            <li><a href="index.html" class="logout-btn">Logout</a></li>
        </ul>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- Main Dashboard Content -->
    <main class="dashboard-container">
        <!-- Welcome Message -->
        <header class="dashboard-header">
            <h1>Welcome, <span id="studentName">Student</span>! 👋</h1>
            <p>Here's an overview of your current progress.</p>
        </header>

        <!-- Stats Cards Grid -->
        <section class="stats-grid">
            <!-- Total Tasks Card -->
            <div class="stat-card">
                <div class="stat-icon total">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </div>
                <div class="stat-info">
                    <h3>Total Tasks</h3>
                    <p class="stat-value" id="totalTasks">12</p>
                </div>
            </div>

            <!-- Completed Tasks Card -->
            <div class="stat-card">
                <div class="stat-icon completed">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <div class="stat-info">
                    <h3>Completed Tasks</h3>
                    <p class="stat-value" id="completedTasks">8</p>
                </div>
            </div>

            <!-- Pending Tasks Card -->
            <div class="stat-card">
                <div class="stat-icon pending">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                <div class="stat-info">
                    <h3>Pending Tasks</h3>
                    <p class="stat-value" id="pendingTasks">4</p>
                </div>
            </div>
        </section>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
