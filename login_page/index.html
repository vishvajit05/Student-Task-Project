<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        
        <!-- Added Welcome Text -->
        <h1 class="welcome-text">Welcome Back!</h1>
        <p class="sub-text">Log in to manage your tasks effectively</p>

        <h2>Login</h2>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
            </div>

            <button type="submit" id="loginBtn">Login</button>
            
            <div id="loginMessage" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>

            <div style="text-align: center; margin-top: 15px;">
                <a href="forgot.html" style="color: #667eea; text-decoration: none; font-size: 14px; font-weight: 500;">Forgot Password?</a>
            </div>
            <p class="auth-link">Don't have an account? <a href="register.html">Register</a></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
